name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode project
        run: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Build
        run: |
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Không tìm thấy Xcode project"
            exit 1
          fi

          xcodebuild -list -project "$PROJECT"

          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r FF.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FF-IPA
          path: FF.ipa
